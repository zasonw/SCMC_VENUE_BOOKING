const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let language='en';
const STORE='gather-review-v1';const HOUR=3600000;let role='member',view='schedule',mode='calendar',roomFilter='',statusFilter='',query='',listFilter='all',offset=0;let rooms=[],bookings=[];let persistence=true;let me='';let selected='',month='';let slotStart='14:00',slotEnd='16:00';let slotSelection=null;let bookingStyle='slots';
const now=()=>Date.now()+offset;
function dayKey(t=now()){const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Singapore',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(t));const v=k=>parts.find(p=>p.type===k).value;return v('year')+'-'+v('month')+'-'+v('day');}

function seed(){rooms=Array.from({length:8},(_,i)=>({id:i+1,name:'Room '+(i+1),enabled:true}));const base=addDays(dayKey(),3);const samples=[
[0,1,'09:00','11:00','Morning prayer','Prayer Fellowship','Sarah Tan','confirmed',false],
[0,3,'10:00','12:00','Youth leaders catch-up','Youth Fellowship','Daniel Lim','pending',false],
[0,2,'14:00','16:00','Growing together','Cell Group A',me,'confirmed',true],
[0,5,'15:00','17:00','Music practice','Worship Team','Rachel Wong','confirmed',false],
[0,7,'18:00','20:00','Fellowship night','Young Adults',me,'pending',true],
[1,4,'09:00','12:00','Sunday preparation','Service Team','Marcus Lee','confirmed',false],
[1,1,'13:00','15:00','Welcome lunch','Welcome Team','Grace Tan','pending',false],
[2,6,'19:00','21:00','Bible study','Cell Group B','Peter Ng','confirmed',false],
[-2,2,'19:00','21:00','Small group gathering','Cell Group A',me,'confirmed',true],
[4,8,'14:00','16:00','Room maintenance','Facilities','Admin','blocked',false],
[7,3,'10:00','12:00','Youth fellowship','Youth Fellowship','Daniel Lim','confirmed',false],
[9,4,'16:00','18:00','Planning together','Cell Group C','Joyce Lee','confirmed',false]];
bookings=samples.map((s,i)=>({id:'sample-'+i,date:addDays(base,s[0]),room:s[1],start:s[2],end:s[3],title:s[4],group:s[5],pic:s[6],status:s[7],owner:s[8]?'member':'other',contact:'',attendance:s[8]?'18':'',notes:s[8]?'A relaxed time to connect and share.':'',created:now()-(s[7]==='pending'?42:60)*HOUR,approval:s[7]==='confirmed'?'Admin':'',history:[{at:now()-60*HOUR,text:'Sample booking created'}]}));selected=base;month=base.slice(0,7);}
function save(){try{localStorage.setItem(STORE,JSON.stringify({rooms,bookings,offset,selected}));}catch{persistence=false;}}
function load(){try{const s=JSON.parse(localStorage.getItem(STORE));if(s&&Array.isArray(s.rooms)&&s.rooms.length===8&&Array.isArray(s.bookings)){rooms=s.rooms;bookings=s.bookings;offset=Number(s.offset)||0;selected=s.selected||dayKey();month=selected.slice(0,7);return;}}catch{persistence=false;}seed();save();}
function processApprovals(){let changed=false;for(const b of bookings){if(b.status!=='pending')continue;if(stamp(b.date,b.start)<=now()){b.status='expired';recordHistory(b,'Expired: start time passed without confirmation');changed=true;}else if(now()>=b.created+48*HOUR){b.status='confirmed';b.approval='Automatic';recordHistory(b,'Automatically approved after 48 hours');changed=true;}}if(changed)save();return changed;}

function dayBookings(){return filtered().filter(b=>b.date===selected&&active(b)).sort((a,b)=>a.start.localeCompare(b.start));}

function renderSchedule(){let html=(role==='admin'?'<div class="desktop-management"><span>'+bookings.filter(b=>b.status==='pending').length+' <span>pending requests</span></span><button class="secondary" onclick="navigate(\'admin\');listFilter=\'pending\';render()">Review</button><button class="secondary" onclick="openForm(null,null,null,true)">Block</button><button class="secondary" onclick="manageRooms()">Rooms</button></div>':'')+'<div class="toolbar"><div class="seg"><button class="'+(mode==='calendar'?'active':'')+'" onclick="setMode(\'calendar\')">Calendar</button><button class="'+(mode==='venues'?'active':'')+'" onclick="setMode(\'venues\')">By venue</button></div>'+filterBar()+'</div>';if(mode==='calendar')html+='<div class="calendar-layout"><div class="panel">'+calendarHTML()+'</div><aside class="panel agenda">'+agendaHTML()+'</aside></div>';else html+='<div class="panel">'+timelineHTML()+'</div>';document.getElementById('content').innerHTML=html;}

function slotTime(i){const minutes=360+i*30;return String(Math.floor(minutes/60)).padStart(2,'0')+':'+String(minutes%60).padStart(2,'0');}
function slotGridHTML(){const shown=rooms.filter(r=>!roomFilter||r.id===+roomFilter);let html='<div class="slot-date"><label><span>Booking date</span><input type="date" value="'+selected+'" aria-label="Booking date" onchange="if(this.value)selectDay(this.value)"></label></div><div class="slot-legend"><span><i class="slot-key available"></i>Available</span><span><i class="slot-key selected"></i>Selected</span><span><i class="slot-key confirmed"></i>Booked</span><span><i class="slot-key pending"></i>Pending</span><span><i class="slot-key blocked"></i>Blocked</span></div><div class="slot-scroll" data-grid-key="'+selected+':'+shown.map(r=>r.id).join(',')+'"><table class="slot-table '+(shown.length===1?'single-room':'')+'" style="--slot-min-width:'+(84+shown.length*104)+'px"><colgroup><col style="width:84px"><col span="'+shown.length+'"></colgroup><thead><tr><th scope="col">Time</th>'+shown.map(r=>'<th scope="col">'+esc(roomName(r.id))+'</th>').join('')+'</tr></thead><tbody>';for(let i=0;i<34;i++){const start=slotTime(i),end=slotTime(i+1);html+='<tr><th scope="row">'+timeLabel(start)+'<small>'+timeLabel(end)+'</small></th>'+shown.map(r=>{const held=conflict({room:r.id,date:selected,start,end});const expired=stamp(selected,start)<=now();const state=held?held.status:!r.enabled||expired?'blocked':slotSelection&&slotSelection.room===r.id&&i>=slotSelection.first&&i<=slotSelection.last?'selected':'available';const text=state==='available'?'Available':state==='selected'?'Selected':state==='pending'?'Pending':state==='confirmed'?'Booked':'Blocked';return '<td><button data-room="'+r.id+'" data-slot="'+i+'" class="time-slot '+state+'" aria-label="'+esc(roomName(r.id))+' '+start+'–'+end+' '+text+'" aria-pressed="'+(state==='selected')+'" '+(!held&&state==='blocked'?'disabled':'')+' onclick="'+(held?'openDetail(\''+held.id+'\')':'pickSlot('+r.id+','+i+')')+'"><span>'+text+'</span></button></td>';}).join('')+'</tr>';}const summary=slotSelection?esc(roomName(slotSelection.room))+' · '+timeLabel(slotTime(slotSelection.first))+'–'+timeLabel(slotTime(slotSelection.last+1)):'Select a time';return html+'</tbody></table></div><div class="slot-proceed"><div class="slot-summary" aria-live="polite">'+summary+'</div><div class="slot-proceed-actions">'+(slotSelection?'<button class="secondary" onclick="clearSlotSelection()">Clear</button>':'')+'<button class="primary" '+(slotSelection?'':'disabled')+' onclick="proceedSlots()">Proceed</button></div></div>';}
function bookingViewToggle(){return '<div class="booking-view-toggle"><div class="seg"><button class="'+(bookingStyle==='slots'?'active':'')+'" aria-pressed="'+(bookingStyle==='slots')+'" onclick="setBookingStyle(\'slots\')">Slots</button><button class="'+(bookingStyle==='classic'?'active':'')+'" aria-pressed="'+(bookingStyle==='classic')+'" onclick="setBookingStyle(\'classic\')">Classic</button></div><small>06:00–23:00</small></div>';}
function setBookingStyle(style){bookingStyle=style==='classic'?'classic':'slots';if(slotSelection){slotStart=slotTime(slotSelection.first);slotEnd=slotTime(slotSelection.last+1);}render();}
function classicBookingHTML(){const valid=slotStart<slotEnd&&slotStart>='06:00'&&slotEnd<='23:00'&&stamp(selected,slotStart)>now();return '<div class="slot-date"><label><span>Booking date</span><input type="date" value="'+selected+'" aria-label="Booking date" onchange="if(this.value)selectDay(this.value)"></label></div><div class="availability-body" style="padding-top:15px"><div class="booking-times"><label><span>Start time</span><input type="time" value="'+slotStart+'" min="06:00" max="23:00" aria-label="Start time" onchange="slotStart=this.value;slotSelection=null;render()"></label><label><span>End time</span><input type="time" value="'+slotEnd+'" min="06:00" max="23:00" aria-label="End time" onchange="slotEnd=this.value;slotSelection=null;render()"></label></div>'+(!valid?'<p class="availability-note">Choose a future time between 06:00 and 23:00.</p>':'')+'<div class="availability-rooms">'+rooms.filter(r=>!roomFilter||r.id===+roomFilter).map(r=>{const held=conflict({room:r.id,date:selected,start:slotStart,end:slotEnd});const free=valid&&r.enabled&&!held;return '<button class="room-choice '+(free?'available':'')+'" '+(free?'':'disabled')+' onclick="bookSlot('+r.id+')"><strong>'+esc(roomName(r.id))+'</strong><small>'+(free?'Book':!r.enabled?'Disabled':held?'Booked':'Unavailable')+'</small></button>';}).join('')+'</div></div>';}
function availabilityHTML(){return slotGridHTML();}
function pickSlot(room,index){const start=slotTime(index),end=slotTime(index+1);if(!rooms.find(r=>r.id===room)?.enabled||stamp(selected,start)<=now()||conflict({room,date:selected,start,end}))return;let next;if(slotSelection&&slotSelection.room===room){if(slotSelection.first===index&&slotSelection.last===index){slotSelection=null;updateSlotSelection();return;}next={room,first:Math.min(index,slotSelection.first),last:Math.max(index,slotSelection.last)};}else next={room,first:index,last:index};if(conflict({room,date:selected,start:slotTime(next.first),end:slotTime(next.last+1)}))return toast('Choose consecutive available slots.');slotSelection=next;updateSlotSelection();}
function proceedSlots(){if(!slotSelection)return;const {room,first,last}=slotSelection;slotStart=slotTime(first);slotEnd=slotTime(last+1);if(conflict({room,date:selected,start:slotStart,end:slotEnd})||stamp(selected,slotStart)<=now())return toast('This time is no longer available.');openForm(room,null,slotStart);document.querySelector('#booking-form [name="end"]').value=slotEnd;}
function bookSlot(room){const candidate={room,date:selected,start:slotStart,end:slotEnd};if(conflict(candidate)||slotStart>=slotEnd||stamp(selected,slotStart)<=now())return toast('Please choose an available future time.');openForm(room,null,slotStart);document.querySelector('#booking-form [name="end"]').value=slotEnd;}

function calendarHTML(){const start=month+'-01';const wd=new Date(start+'T12:00:00').getDay();const first=addDays(start,-((wd+6)%7));let html='<div class="panel-head"><h2>'+dateLabel(start,{month:'long',year:'numeric'})+'</h2><div class="month-controls"><button class="today-btn" onclick="today()">Today</button><button class="icon-btn" aria-label="Previous month" onclick="shiftMonth(-1)">'+icon('left')+'</button><button class="icon-btn" aria-label="Next month" onclick="shiftMonth(1)">'+icon('right')+'</button></div></div><div class="weekdays">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>'<span>'+d+'</span>').join('')+'</div><div class="calendar-grid">';const daysInMonth=new Date(Number(month.slice(0,4)),Number(month.slice(5)),0).getDate();const cells=Math.ceil((((wd+6)%7)+daysInMonth)/7)*7;for(let i=0;i<cells;i++){const d=addDays(first,i),bs=filtered().filter(b=>b.date===d&&active(b)).sort((a,b)=>a.start.localeCompare(b.start));html+='<div class="day '+(d===selected?'selected ':'')+(d===dayKey()?'is-today ':'')+(d.slice(0,7)!==month?'outside':'')+'" tabindex="0" role="button" aria-label="'+dateLabel(d,{weekday:'long',day:'numeric',month:'long'})+', '+bs.length+' bookings" onclick="selectDay(\''+d+'\')" onkeydown="if(event.target===this&&(event.key===\'Enter\'||event.key===\' \')){event.preventDefault();selectDay(\''+d+'\')}"><span class="day-num">'+Number(d.slice(-2))+'</span>'+bs.map(b=>'<button class="event-chip '+b.status+'" onclick="event.stopPropagation();openDetail(\''+b.id+'\')">'+esc(roomName(b.room))+'<span class="event-name"> · '+timeLabel(b.start)+'</span></button>').join('')+'</div>';}return html+'</div><div class="legend"><span><i class="dot"></i>Confirmed</span><span><i class="dot pending"></i>Pending</span><span><i class="dot blocked"></i>Unavailable</span><button class="mobile-day-btn" onclick="showAgenda()">Selected day →</button></div>';}
function agendaHTML(){const bs=dayBookings();return '<div class="agenda-head"><div class="eyebrow">Selected day</div><div class="row"><h2>'+dateLabel(selected,{weekday:'short',day:'numeric',month:'short'})+'</h2><small>'+bs.length+' bookings</small></div></div><div class="agenda-body">'+(bs.length?bs.map(b=>'<button class="agenda-item" onclick="openDetail(\''+b.id+'\')"><div class="row"><span class="item-time">'+timeLabel(b.start)+' – '+timeLabel(b.end)+'</span>'+badge(b)+'</div><h3>'+esc(b.title)+'</h3><p>'+esc(roomName(b.room))+' · '+esc(b.group)+'</p><p>PIC · '+esc(b.pic)+'</p></button>').join(''):'<div class="empty">'+icon('calendar')+'<strong>Room to gather</strong>No bookings match this day.</div>')+'</div><div class="agenda-foot"><button class="secondary" onclick="openClassicBooking()">＋ Book this date</button></div>';}
function showAgenda(){showModal(agendaHTML());}
function timelineHTML(){return availabilityHTML();}
function trackBook(e,r){const rect=e.currentTarget.getBoundingClientRect();const h=Math.min(21,8+Math.floor((e.clientX-rect.left)/rect.width*15));openForm(r,null,String(h).padStart(2,'0')+':00');}
function renderRooms(){document.getElementById('content').innerHTML='<div class="toolbar"><h2>Our venues</h2><input type="date" aria-label="Room availability date" value="'+selected+'" onchange="if(this.value)selectDay(this.value)"></div><p class="section-note">Bookings on '+dateLabel(selected,{weekday:'long',day:'numeric',month:'long'})+' · Choose a room to see its schedule.</p><div class="rooms-grid">'+rooms.map(r=>{const n=bookings.filter(b=>b.room===r.id&&b.date===selected&&active(b)).length;return '<div class="room-card">'+icon('rooms')+'<h3>'+esc(r.name)+'</h3><p>'+(!r.enabled?'Not accepting new bookings':n?n+' booking'+(n>1?'s':'')+' on selected day':'No bookings on selected day')+'</p><button class="secondary" onclick="roomFilter=\''+r.id+'\';mode=\'venues\';navigate(\'schedule\')">View schedule →</button></div>';}).join('')+'</div>';}
function renderList(){const admin=view==='admin';let bs=bookings.filter(b=>admin||b.owner==='member').filter(b=>listFilter==='all'||b.status===listFilter).filter(b=>!query||(b.title+' '+b.group+' '+b.pic+' '+roomName(b.room)).toLowerCase().includes(query.toLowerCase())).sort((a,b)=>admin?(a.status==='pending'?0:1)-(b.status==='pending'?0:1)||a.created-b.created:stamp(a.date,a.start)-stamp(b.date,b.start));document.getElementById('content').innerHTML=(admin?'<div class="notice"><strong>48-hour approval</strong> · Pending requests hold the slot.</div>':'')+'<div class="toolbar"><div class="seg">'+[['all','All'],['pending','Pending'],['confirmed','Confirmed'],['cancelled','Cancelled']].map(([v,t])=>'<button class="'+(listFilter===v?'active':'')+'" onclick="listFilter=\''+v+'\';render()">'+t+'</button>').join('')+'</div>'+(admin?'<div class="card-actions"><button class="secondary" onclick="openForm(null,null,null,true)">🔒 Block</button><button class="secondary" onclick="manageRooms()">🚪 Rooms</button></div>':'')+'</div><div class="toolbar"><input class="search" type="search" value="'+esc(query)+'" placeholder="Search activity, group or PIC…" aria-label="Search bookings" oninput="searchBookings(this)"><small>'+bs.length+' booking'+(bs.length===1?'':'s')+'</small></div><div class="booking-list">'+(bs.length?bs.map(b=>'<article class="booking-card"><div class="date-tile"><small>'+dateLabel(b.date,{month:'short'})+'</small><strong>'+Number(b.date.slice(-2))+'</strong></div><div class="card-main"><div class="row" style="justify-content:start;flex-wrap:wrap"><h3>'+esc(b.title)+'</h3>'+badge(b)+'</div><p>'+esc(roomName(b.room))+' · '+timeLabel(b.start)+'–'+timeLabel(b.end)+' · '+esc(b.group)+'</p><p>PIC: '+esc(b.pic)+(b.status==='pending'?' · '+pendingText(b):b.status==='confirmed'?' · '+(b.approval==='Automatic'?'Automatically approved':'Approved by admin'):'')+'</p></div><div class="card-actions"><button class="secondary" onclick="openDetail(\''+b.id+'\')">👁️ View</button>'+(canCancel(b)?'<button class="danger" onclick="confirmCancel(\''+b.id+'\')">'+(b.status==='blocked'?'🔓 Unblock':'✕ Cancel')+'</button>':'')+(admin&&b.status==='pending'?'<button class="primary" onclick="approve(\''+b.id+'\')">✅ Approve</button>':'')+'</div></article>').join(''):'<div class="panel empty">'+icon('list')+'<strong>No bookings here yet</strong>Try another filter or create your first booking.</div>')+'</div>';}
function searchBookings(el){const pos=el.selectionStart;query=el.value;renderList();const input=document.querySelector('.search');input.focus();input.setSelectionRange(pos,pos);}
function pendingText(b){return b.created+48*HOUR>=stamp(b.date,b.start)?'Admin approval needed before start':'Auto-approves '+fullStamp(b.created+48*HOUR);}
function showModal(html){const m=document.getElementById('modal');m.innerHTML=html;if(!m.open)m.showModal();}
function closeModal(){document.getElementById('modal').close();}
function modalHead(title,sub=''){return '<div class="modal-head"><div><h2>'+title+'</h2>'+(sub?'<p>'+sub+'</p>':'')+'</div><button class="icon-btn" aria-label="Close dialog" onclick="closeModal()">'+icon('close')+'</button></div>';}
function openForm(room=null,id=null,start=null,block=false){const b=id?bookings.find(b=>b.id===id):null;if(b&&role!=='admin'&&b.owner!=='member')return;if(block&&role!=='admin')return;const d=b?.date||(selected<dayKey()?dayKey():selected);const roomVal=b?.room||room||Number(roomFilter)||rooms.find(r=>r.enabled)?.id;const input=(name,label,value='',type='text',required=false,wide=false)=>'<label class="field '+(wide?'wide':'')+'"><span>'+label+(required?'':' <small>Optional</small>')+'</span><input name="'+name+'" type="'+type+'" value="'+esc(value)+'" '+(required?'required':'')+(type==='text'?' maxlength="120"':'')+'></label>';showModal(modalHead(b?'Edit booking':block?'Block a room':'Plan your next gathering',block?'Make a room unavailable for a specific time.':'Your slot is held while awaiting approval.')+'<form id="booking-form" onsubmit="submitBooking(event,\''+(id||'')+'\','+block+')"><div class="modal-body"><div class="form-grid">'+input('title',block?'Reason / title':'Purpose',b?.title||(block?'Room maintenance':''),'text',true,true)+(block?input('group','Group / fellowship',b?.group||'Facilities','text',true,true):fellowshipField(b?.group||''))+'<label class="field"><span>Venue</span><select name="room" required>'+rooms.filter(r=>r.enabled||r.id===b?.room).map(r=>'<option value="'+r.id+'" '+(r.id===roomVal?'selected':'')+'>'+esc(r.name)+'</option>').join('')+'</select></label>'+input('date','Date',d,'date',true)+input('start','Start time',b?.start||start||'14:00','time',true)+input('end','End time',b?.end||(start?String(Number(start.slice(0,2))+1).padStart(2,'0')+':00':'16:00'),'time',true)+input('pic','PIC',b?.pic||(role==='admin'?'Alex':me),'text',true)+'<details class="optional-fields wide" '+(b?.contact||b?.attendance||b?.notes?'open':'')+'><summary>More details</summary><div class="form-grid">'+input('contact','PIC contact',b?.contact||'')+input('attendance','Estimated attendance',b?.attendance||'','number')+'<label class="field wide"><span>Notes <small>Optional</small></span><textarea name="notes" maxlength="1500" placeholder="Anything the venue team should know?">'+esc(b?.notes||'')+'</textarea></label></div></details></div><div class="notice" style="margin:18px 0 0">'+(block?'This time slot becomes unavailable immediately.':b?'Changing the date, time or venue restarts the 48-hour approval window.':'Auto-approval after 48h. Earlier events need admin approval.')+'</div><div class="form-error" id="form-error" role="alert"></div></div><div class="modal-footer"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button type="submit" class="primary">'+(b?'Save changes':block?'Block time':'Submit booking')+'</button></div></form>');}
function submitBooking(event,id,block){event.preventDefault();const f=new FormData(event.target),old=bookings.find(b=>b.id===id);const b={id:id||('b'+now()+Math.random().toString(36).slice(2,7)),room:Number(f.get('room')),date:f.get('date'),start:f.get('start'),end:f.get('end'),title:String(f.get('title')).trim(),group:String(f.get('group')).trim(),pic:String(f.get('pic')).trim(),contact:String(f.get('contact')).trim(),attendance:f.get('attendance'),notes:String(f.get('notes')).trim()};let error='';if(!b.title||!b.group||!b.pic)error='Please enter the activity, group and PIC.';else if(b.end<=b.start)error='End time must be later than start time.';else if(stamp(b.date,b.start)<=now())error='Please choose a start time in the future.';else if(b.start<'06:00'||b.end>'23:00')error='For this MVP, booking hours are 6:00am to 11:00pm.';else if(b.attendance!==''&&(!Number.isInteger(+b.attendance)||+b.attendance<1))error='Attendance must be a positive whole number, or left blank.';else if(!rooms.find(r=>r.id===b.room)?.enabled)error='This room is not accepting bookings.';else if(conflict(b,id))error='This room is already held or booked during that time. Choose another time or venue.';if(!error&&old&&old.status==='confirmed'&&role!=='admin'&&(old.room!==b.room||old.date!==b.date||old.start!==b.start||old.end!==b.end))error='Ask an admin to reschedule a confirmed booking. You can still edit its other details.';if(error){const el=document.getElementById('form-error');el.textContent=translateText(error);el.style.display='block';return;}const moved=old&&(old.room!==b.room||old.date!==b.date||old.start!==b.start||old.end!==b.end);Object.assign(b,{status:block?'blocked':old&&!moved?old.status:'pending',owner:old?.owner||(role==='member'?'member':'admin'),created:old&&!moved?old.created:now(),approval:old&&!moved?old.approval:'',history:old?.history||[]});recordHistory(b,old?(moved?'Booking rescheduled; approval window restarted':'Booking details updated'):(block?'Room blocked by admin':'Booking submitted; slot reserved'));if(old)bookings[bookings.indexOf(old)]=b;else bookings.push(b);selected=b.date;month=b.date.slice(0,7);save();closeModal();render();toast(block?'Room availability updated':old?'Booking updated':'Request submitted. Your slot is held.');}
function openDetail(id){const b=bookings.find(b=>b.id===id);if(!b)return;const own=b.owner==='member',canEdit=role==='admin'||own;const details=[['Venue',roomName(b.room)],['Date',dateLabel(b.date,{weekday:'short',day:'numeric',month:'long',year:'numeric'})],['Time',timeLabel(b.start)+' – '+timeLabel(b.end)],['Fellowship',b.group],['Purpose',b.title],['Person in charge',b.pic],['Attendance',b.attendance||'Not specified']];if(canEdit)details.push(['PIC contact',b.contact||'Not provided']);showModal(modalHead(esc(b.title),esc(roomName(b.room))+' · Booking details')+'<div class="modal-body">'+badge(b)+(b.status==='pending'?'<div class="notice" style="margin:13px 0 0">'+pendingText(b)+'. This time slot is reserved.</div>':'')+(b.status==='confirmed'?'<p class="section-note">'+(b.approval==='Automatic'?'Automatically approved after 48 hours.':'Approved by admin.')+(role==='member'&&own?' Contact an admin to cancel this confirmed booking.':'')+'</p>':'')+'<dl class="detail-grid">'+details.map(([k,v])=>'<div><dt>'+k+'</dt><dd>'+esc(v)+'</dd></div>').join('')+'</dl>'+(b.notes?'<div class="detail-notes">'+esc(b.notes)+'</div>':'')+(b.reason?'<p class="section-note">Reason: '+esc(b.reason)+'</p>':'')+(canEdit?'<div class="history"><strong style="font-size:12px">Activity history</strong>'+b.history.map(h=>'<p>'+fullStamp(h.at)+' · '+esc(translateText(h.text))+'</p>').join('')+'</div>':'')+'</div><div class="modal-footer">'+(canCancel(b)?'<button class="danger" onclick="confirmCancel(\''+id+'\')">'+(b.status==='blocked'?'🔓 Unblock':'✕ Cancel')+'</button>':'')+(canEdit&&['pending','confirmed'].includes(b.status)?'<button class="secondary" onclick="openForm(null,\''+id+'\')">✏️ Edit</button>':'')+(role==='admin'&&b.status==='pending'?'<button class="secondary" onclick="rejectForm(\''+id+'\')">⛔ Reject</button><button class="primary" onclick="approve(\''+id+'\')">✅ Approve</button>':'<button class="primary" onclick="closeModal()">Done</button>')+'</div>');}
function approve(id){if(role!=='admin')return;processApprovals();const b=bookings.find(b=>b.id===id);if(!b||b.status!=='pending'){render();return toast('This request is no longer pending.');}b.status='confirmed';b.approval='Admin';recordHistory(b,'Approved by Alex · Admin');save();closeModal();render();toast('Booking confirmed.');}
function rejectForm(id){showModal(modalHead('Reject this request','The reason will be visible to the booker.')+'<form onsubmit="event.preventDefault();rejectBooking(\''+id+'\',this.reason.value)"><div class="modal-body"><label class="field">Reason<textarea name="reason" required maxlength="500" placeholder="Explain why the booking cannot go ahead…"></textarea></label></div><div class="modal-footer"><button type="button" class="secondary" onclick="openDetail(\''+id+'\')">Back</button><button class="danger">Reject booking</button></div></form>');}
function rejectBooking(id,reason){const b=bookings.find(b=>b.id===id);if(role!=='admin'||!reason.trim()||b?.status!=='pending')return;b.status='rejected';b.reason=reason.trim();recordHistory(b,'Rejected by Alex · Admin: '+b.reason);save();closeModal();render();toast('Request rejected. The slot is available again.');}
function confirmCancel(id){processApprovals();const b=bookings.find(b=>b.id===id);if(!canCancel(b)){render();return toast('Only an admin can cancel a confirmed booking.');}showModal(modalHead(b.status==='blocked'?'Remove this block?':'Cancel this booking?','The time slot will become available to others.')+'<div class="modal-body"><strong>'+esc(b.title)+'</strong><p class="section-note">'+esc(roomName(b.room))+' · '+dateLabel(b.date)+' · '+timeLabel(b.start)+'</p></div><div class="modal-footer"><button class="secondary" onclick="openDetail(\''+id+'\')">Keep booking</button><button class="danger" onclick="cancelBooking(\''+id+'\')">Confirm cancellation</button></div>');}
function cancelBooking(id){processApprovals();const b=bookings.find(b=>b.id===id);if(!canCancel(b)){closeModal();render();return toast('Cancellation is not available. Confirmed bookings need an admin.');}b.status='cancelled';recordHistory(b,'Cancelled by '+(role==='admin'?'Alex · Admin':me));save();closeModal();render();toast('Booking cancelled. The slot is available again.');}
function manageRooms(){if(role!=='admin')return;showModal(modalHead('Manage venues','Renaming a room updates it throughout the calendar.')+'<form onsubmit="saveRooms(event)"><div class="modal-body">'+rooms.map(r=>'<div class="room-manage"><input aria-label="Room '+r.id+' name" name="room'+r.id+'" value="'+esc(r.name)+'" required maxlength="40"><select name="enabled'+r.id+'" aria-label="Room '+r.id+' availability"><option value="yes" '+(r.enabled?'selected':'')+'>Active</option><option value="no" '+(!r.enabled?'selected':'')+'>Disabled</option></select></div>').join('')+'<p class="section-note">Disabling stops new bookings. Existing bookings remain visible and can be cancelled individually.</p><div class="form-error" id="room-error"></div></div><div class="modal-footer"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button class="primary">Save venues</button></div></form>');}
function saveRooms(e){e.preventDefault();if(role!=='admin')return;const f=new FormData(e.target),names=rooms.map(r=>String(f.get('room'+r.id)).trim());if(names.some(n=>!n)||new Set(names.map(n=>n.toLowerCase())).size!==rooms.length){const err=document.getElementById('room-error');err.textContent=translateText('Please use a unique, non-empty name for each room.');err.style.display='block';return;}rooms.forEach((r,i)=>{r.name=names[i];r.enabled=f.get('enabled'+r.id)==='yes';});save();closeModal();render();toast('Venues updated.');}

function advanceClock(){offset+=48*HOUR;processApprovals();save();closeModal();render();toast('Demo clock advanced. Pending requests processed.');}
function resetPrompt(){showModal(modalHead('Reset the preview?','Your demo bookings and room changes will be removed.')+'<div class="modal-footer"><button class="secondary" onclick="openDemo()">Keep changes</button><button class="danger" onclick="resetDemo()">Reset demo</button></div>');}

function compactActions(root){if(!root)return;root.querySelectorAll('button').forEach(button=>{if(button.classList.contains('event-chip')||button.classList.contains('agenda-item')||button.classList.contains('slot'))return;const raw=button.cloneNode(true);raw.querySelectorAll('svg,.nav-count,span[aria-hidden="true"]').forEach(el=>el.remove());const label=button.getAttribute('data-action-label')||raw.textContent.trim();const item=shortActions[label];if(!item)return;const count=button.querySelector('.nav-count')?.outerHTML||'';button.innerHTML='<span class="action-label">'+item[1]+'</span>'+count;button.classList.remove('compact-action');button.classList.add('short-action');button.setAttribute('data-action-label',label);button.setAttribute('aria-label',label);button.setAttribute('data-en-aria-label',label);button.setAttribute('data-tooltip',label);});}
const languageNodes=new WeakMap();
function translateText(value){if(language!=='zh')return value;const lead=value.match(/^\s*/)[0],tail=value.match(/\s*$/)[0];let t=value.trim();if(translations[t])return lead+translations[t]+tail;
// Preserve user-entered content and identities.
if(bookings.some(b=>[b.title,b.group,b.pic,b.notes,b.contact,b.reason].includes(t)))return value;
t=t.replace(/Room (\d+)/g,'场地 $1').replace(/\b(\d+) bookings?\b/g,'$1 项预约').replace(/\bPIC:/g,'负责人：').replace(/\bPIC ·/g,'负责人 ·').replace('Auto-approves ','自动批准时间：').replace('Admin approval needed before start','须在开始前获管理员批准').replace('. This time slot is reserved.','。时段已保留').replace('Approved by admin','管理员已批准').replace('Automatically approved','已自动批准').replace('Contact an admin to cancel this confirmed booking.','如需取消，请联系管理员').replace('Reason: ','原因：').replace('Cancelled by ','取消人：').replace('Rejected by Alex · Admin: ','管理员 Alex 拒绝：').replace(' · Booking details',' · 预约详情').replace('Book ','预约 ').replace(' name','名称').replace(' availability','状态').replace('Selected day →','所选日期 →').replace(' on selected day','（当天）').replace('Bookings on ','预约日期：').replace(' · Choose a room to see its schedule.',' · 点击场地查看日程').replace('Tap an empty space to book · Pending requests hold their slot · Scroll horizontally on smaller screens','点击空闲时段预约 · 待审批即保留时段 · 可左右滑动').replace(' · Demo clock: ',' · 演示时间：').replace('Current demo time: ','当前演示时间：').replace('. Move forward 48 hours to process pending requests. Requests whose start time has passed will expire.','。快进 48 小时以处理待审批预约，已超过开始时间的预约将过期。').replace('Changes are saved in this browser when storage is available.','修改保存在当前浏览器。').replace('Demo changes last for this preview session.','修改仅保留在此次预览中。').replace('Browser storage is unavailable; changes last only for this session.','无法保存到浏览器，修改仅保留在本次会话中。').replace(' In this preview, approval processing runs only while the page is open.',' 此演示仅在页面打开时处理审批。');return lead+t+tail;}
function applyLanguage(root){if(!root)return;compactActions(root);const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let node;while(node=walker.nextNode()){if(['SCRIPT','STYLE','TEXTAREA','OPTION'].includes(node.parentElement?.tagName)&&node.parentElement?.tagName!=='OPTION')continue;let raw=languageNodes.get(node);if(raw===undefined){raw=node.nodeValue;languageNodes.set(node,raw);}node.nodeValue=translateText(raw);}root.querySelectorAll('[aria-label],[placeholder],[data-tooltip]').forEach(el=>{for(const attr of ['aria-label','placeholder','data-tooltip']){if(!el.hasAttribute(attr))continue;const key='data-en-'+attr;if(!el.hasAttribute(key))el.setAttribute(key,el.getAttribute(attr));el.setAttribute(attr,translateText(el.getAttribute(key)));}});document.querySelectorAll('[data-language]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.language===language)));document.documentElement.lang=language==='zh'?'zh-Hans':'en';}
function setLanguage(next){language=next==='zh'?'zh':'en';try{localStorage.setItem('gather-language',language);}catch{}render();applyLanguage(document.getElementById('modal'));}
